<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Edit Expense</title>
    <!-- Pull in Bootstrap again so the edit page matches the home page -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h2 class="mb-4">Edit Expense</h2>

                    <!-- We use {{ expense[X] }} to pre-fill the boxes with the old data -->
                    <form action="/edit/{{ expense[0] }}" method="POST">
                        <div class="mb-3">
                            <label class="form-label">Date (YYYY-MM-DD):</label>
                            <input type="text" name="date" value="{{ expense[1] }}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Category:</label>
                            <input type="text" name="category" value="{{ expense[2] }}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Description:</label>
                            <input type="text" name="description" value="{{ expense[3] }}" class="form-control"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Amount:</label>
                            <input type="number" step="any" name="amount" value="{{ expense[4] }}" class="form-control"
                                required>
                        </div>

                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a href="/" class="btn btn-secondary ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
